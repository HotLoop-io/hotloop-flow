# ── Image ────────────────────────────────────────────────────────────────────
image:
  repository: ghcr.io/hotloop-io/hotloop-flow
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

# ── Replicas ─────────────────────────────────────────────────────────────────
# One. HotLoop Flow holds flow state and open connections to brokers and PLCs;
# two replicas behind one Service would both subscribe and both write. Scaling
# out means deploying a second instance with its own flows, which is what the
# multi-instance support in the App Store is for.
replicaCount: 1

# ── Resources ────────────────────────────────────────────────────────────────
# Presets rather than raw numbers, matching the node-red chart so an operator
# switching between them does not have to think. Default is "small", which is
# most of the point of this project: the node-red chart's default requests
# 512Mi and limits 2Gi.
resources:
  preset: small     # small | medium | large | custom
  presets:
    small:
      requests: { cpu: 10m, memory: 64Mi }
      limits:   { cpu: 500m, memory: 256Mi }
    medium:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 1000m, memory: 512Mi }
    large:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { cpu: 2000m, memory: 2Gi }
  custom: {}

# ── Service ──────────────────────────────────────────────────────────────────
# ClusterIP is mandatory: the dashboard proxies apps by service DNS, and a
# NodePort or LoadBalancer would not be reachable through it.
service:
  type: ClusterIP
  port: 8080          # what the dashboard proxy targets
  targetPort: 1880    # what the binary listens on
  # The editor holds a websocket. Without affinity it breaks behind the proxy
  # the moment there is more than one endpoint.
  sessionAffinity: ClientIP
  sessionAffinityTimeoutSeconds: 10800

# ── App Store integration ────────────────────────────────────────────────────
gui:
  enabled: true
  type: web
  port: 8080
  displayName: ""     # only used when the dashboard did not inject one

# Injected by the dashboard's DeployApp at deploy time. Do not set by hand.
# Labels put on every resource the chart renders, and on the pod. The EmberNET
# dashboard sets these on an App Store deploy (embernet.ai/tenant, app-id, source,
# deployed-by, deployment-id). Empty by default, so a plain helm install is unchanged.
tenantLabels: {}

embernet:
  displayName: ""
  # URL for the embernet.ai/app-icon annotation on the pod and the Service, which
  # is what the dashboard draws on the deployed tile. Empty uses the chart icon.
  # Whatever goes here has to send Access-Control-Allow-Origin, or the tile is blank.
  appIcon: ""


# ── Networking ───────────────────────────────────────────────────────────────
# Three modes. This is the reason HotLoop Flow exists on a plant floor: a flow
# engine that can only see what k3s routes to it cannot inventory an OT segment.
#
#   cluster  ClusterIP only. Multi-instance safe, unlimited per node.
#            Sees what the cluster routes. The default and the right choice
#            unless you specifically need L2 access.
#
#   host     hostNetwork. Sees the host's interfaces, ARP table and broadcast
#            domain. Effectively one instance per node, because the port is
#            the node's. Set network.hostPort to move it off 1880.
#
#   macvlan  Multus attachment. The pod gets its own MAC and its own IP on the
#            target VLAN, so it is BOTH multi-instance safe AND sitting
#            directly on the segment with the PLCs. No port collisions at all,
#            because each instance has its own address.
#
# macvlan needs Multus on the cluster. No other App Store chart ships this yet;
# the retired MACVLAN-K3S-Implementation repo never published an index.
network:
  mode: cluster       # cluster | host | macvlan

  # host mode only.
  hostPort: 1880

  # macvlan mode only.
  macvlan:
    # Create a NetworkAttachmentDefinition, or reference one that already
    # exists by name. Nothing in the catalogue creates these today, so the
    # default is to create one.
    create: true
    # Used when create is false.
    existingName: ""
    # Host interface to attach to. Must exist on every node this can schedule
    # onto — pin with nodeSelector if it does not.
    master: eth1
    mode: bridge      # bridge | vepa | private | passthru
    # Static host-local IPAM. DHCP needs a CNI DHCP daemon on every node, which
    # is a cluster-wide prerequisite rather than a chart concern.
    ipam:
      type: host-local
      subnet: ""        # e.g. 10.20.30.0/24 — required
      rangeStart: ""    # e.g. 10.20.30.200
      rangeEnd: ""      # e.g. 10.20.30.250
      gateway: ""       # e.g. 10.20.30.1
      routes: []        # e.g. [{ dst: 0.0.0.0/0 }]

  # Extra container ports to expose in host mode — Modbus 502, OPC-UA 4840,
  # EtherNet/IP 44818, BACnet 47808.
  extraPorts: []

# ── Discovery ────────────────────────────────────────────────────────────────
# The scan nodes. Off by default: this is a plant-floor inventory tool, not a
# scanner anybody with edit access can aim anywhere. Enabling it without listing
# the networks it may probe is a startup error, not a licence to scan the world.
#
# It needs no extra capability: scan only makes TCP connections and netinfo only
# reads the interface list, so the pod keeps every capability dropped either way.
discovery:
  enabled: false
  allowedCIDRs: []

# ── The exec node ────────────────────────────────────────────────────────────
# Off by default, and enabling it without listing the commands is a startup
# error rather than a licence to run anything.
#
# Node-RED's exec node runs anything, and Node-RED starts with no authentication
# by default. Pilz shipped exactly that on a device and it became CVE-2025-41656
# (CERT@VDE VDE-2025-045): anyone on the network could run commands on it. That
# is Pilz's CVE, not Node-RED's. HotLoop Flow will not start without
# authentication, and this list is the second lock: anyone who does get edit
# access still cannot run a command that is not named here. There is no shell
# either, so an allowed command cannot be chained into an arbitrary one.
#
# Entries are matched on the resolved absolute path. A command that is not on
# the PATH yet is kept and resolved again when a flow uses it, so an init
# container or a mounted volume can supply it after start-up.
exec:
  enabled: false
  allowedCommands: []
  # e.g.
  #   - /usr/bin/mbpoll
  #   - /opt/plant/bin/reset-line

# ── The file nodes ───────────────────────────────────────────────────────────
# Where File, File In and Watch may read and write.
#
# The data directory is always allowed and does not need listing — that is the
# PVC, where a flow's own files belong. Anything else is opt-in. Node-RED's file
# nodes take any path at all, so editing a flow there is equivalent to reading
# any file the process can, including a mounted Secret.
#
# Paths are resolved through symlinks, so a link planted under the PVC cannot
# point out of it. If you add a path here, mount it into the container too.
files:
  allowedPaths: []

# ── Secrets from files ───────────────────────────────────────────────────────
# Kubernetes Secrets mounted read-only, for a tls-config's certificate, key and
# CA and for a node's ew_credentialFiles: a broker or database password the
# flow names by path, so it never sits in the flow file, the deployment log or
# a git mirror.
#
# Every mount path is added to the secret scope automatically. The secret scope
# is not the file nodes' scope: a File In node still cannot read these, which
# is the whole point. A flow can use the password; it cannot post it anywhere.
#
# A rotated Secret takes effect on the next deploy or restart.
secrets:
  mounts: []
  # e.g.
  #   - secretName: plc-broker            # key "password"
  #     mountPath: /etc/hotloop-flow/secrets/plc-broker
  #   - secretName: line3-tls             # cert-manager's tls.crt, tls.key, ca.crt
  #     mountPath: /etc/hotloop-flow/tls/line3
  # Paths already in the container that a secret may be read from, on top of
  # the mounts above.
  allowedPaths: []

# ── Plugins ──────────────────────────────────────────────────────────────────
# Signed WebAssembly plugins, see docs/plugins.md. Off renders nothing, and the
# binary loads nothing. On with no trusted keys, every plugin is refused: a key
# is what you are saying yes to.
plugins:
  enabled: false
  # Where plugin directories are read from. Empty means plugins/ inside the data
  # directory, or mountPath when a volume is set below.
  dir: ""
  # Publisher keys to trust, each "ed25519:<base64>" or a PEM public key. The
  # key is public, so it belongs here and not in a Secret. Get one from
  # `hotloop-flow plugin keygen`.
  trustedKeys: []
  # What each plugin may use, by plugin name: clock, random, context.flow,
  # context.global. A flow using a plugin that asks for more fails the deploy.
  grants: {}
  #   moving-average: []
  #   stamp: [clock]
  # The most memory and the longest time any one plugin node can be given.
  maxMemoryMiB: 64
  maxTimeout: 5s
  # How the plugin files get there. With no volume, copy them into plugins/ on
  # the data volume. With one, it is any Kubernetes volume source, mounted read
  # only at mountPath: an existing claim, a ConfigMap (binaryData, one plugin
  # directory per item path), or a Secret.
  volume: {}
  #   persistentVolumeClaim:
  #     claimName: flow-plugins
  #   configMap:
  #     name: flow-plugins
  #     items:
  #       - {key: moving-average.wasm, path: moving-average/plugin.wasm}
  #       - {key: moving-average.json, path: moving-average/plugin.json}
  #       - {key: moving-average.sig,  path: moving-average/plugin.sig}
  mountPath: /etc/hotloop-flow/plugins

# ── Persistence ──────────────────────────────────────────────────────────────
# 2Gi per the edge Longhorn sweep. Flows, credentials and context all live here.
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""      # "" inherits the cluster default (local-path on k3s)
  accessMode: ReadWriteOnce
  mountPath: /data
  annotations: {}

# ── State database ───────────────────────────────────────────────────────────
# One SQLite file on the data volume holds persistent context and the queues
# behind durable wires. It lives on the persistence volume above, so with
# persistence.enabled false it survives a container restart and not a pod
# replacement.
#
# Every write is a write to an SD card or an SSD, so the defaults batch: context
# changes are held for flushInterval and written together, and a value set to
# what it already was writes nothing. docs/durable/README.md has the measured
# numbers.
store:
  path: ""              # "" is state.db in persistence.mountPath
  # normal: a commit survives the process being killed, and a power cut can lose
  # the last few. full: fsync on every commit, which is the stronger promise and
  # the one that wears the card.
  synchronous: normal   # normal | full
  context:
    # Flow, global and node context survive a restart. false is memory only.
    persist: true
    # A changed value waits this long before it is written, so a kill -9 can
    # lose this much. 0s writes every change before the flow moves on.
    flushInterval: 30s
  durable:
    # Disk quota for every durable wire together. When it is full, the node the
    # wire goes to decides what gives, by the same overflow policy it uses for
    # its inbox.
    maxBytes: 268435456
    # How long a message the target has taken waits to be marked done. Marks
    # share writes. A kill -9 can send the messages inside the window again.
    # 0s marks each one before the next is sent: at most one repeats, at a write
    # per message.
    ackFlush: 100ms

# ── Tracing ──────────────────────────────────────────────────────────────────
# Where each message went, how long every node had it, and what it looked like
# there. The editor reads it: click a debug message to see the path, replay it
# into a draft, or turn it into a test. It is on by default and bounded every
# way, so none of these can make it grow without limit. Memory only: a restart
# starts the list over.
trace:
  enabled: true
  # How many journeys are kept, newest first. One journey is one message
  # entering the flow and everything that came of it.
  traces: 256
  # The most hops one journey keeps. This is what stops a loop in a flow from
  # writing itself down forever.
  maxHops: 512
  # The biggest message a hop keeps a copy of. A bigger one keeps its timing
  # and is marked too big to show.
  maxMessageBytes: 16384
  # The most every journey may hold together, roughly counted. Oldest go first.
  maxBytes: 16777216
  # The most new journeys started in a second. A busier source has the rest of
  # that second go untraced, so tracing cannot cost a fast line what it cannot
  # spare. 0 traces every message.
  perSecond: 1000
  # Send the hops to an OpenTelemetry collector as spans. No endpoint, no
  # export.
  otlp:
    endpoint: ""          # the collector's OTLP/HTTP address, like http://collector:4318
    serviceName: hotloop-flow
    interval: 2s          # the longest a finished hop waits before it is sent
    # Headers for a hosted collector, which are usually an API key and so do
    # not go in the ConfigMap. Name a Secret whose key holds them as
    # Name=value pairs separated by commas, like x-api-key=abc,x-tenant=line3.
    headersSecret:
      name: ""
      key: headers

# ── Deployment history ───────────────────────────────────────────────────────
# Every deploy is kept as a record under /data/deployments: the flow file and
# the encrypted credentials as they were. Roll back from the editor.
history:
  # How many records are kept. 0 keeps every one, which is a decision about
  # disk, since each record is a copy of the flow file.
  retain: 100
  # Mirror every deploy to a git repository as a commit from whoever deployed.
  # Off until a URL is set. http:// and https:// only.
  git:
    url: ""
    # The three below are empty so the binary's own defaults apply: main,
    # flows.json, and flow.invalid, which can never reach anybody.
    branch: ""
    path: ""
    emailDomain: ""
    username: ""
    # The access token. It is a secret, so it never touches the ConfigMap:
    # name a Secret whose key holds it and it reaches the pod as
    # HOTLOOP_FLOW_GIT_PASSWORD.
    passwordSecret:
      name: ""
      key: password

# ── Audit trail ──────────────────────────────────────────────────────────────
# /data/audit.log: who did what in the editor. Rotates, so it cannot fill the
# volume.
audit:
  maxBytes: 16777216    # rotates at this size, 4096 at the least
  keep: 4               # rotated files kept beside the live one

# ── Flow tests ───────────────────────────────────────────────────────────────
tests:
  # true refuses a deploy whose flows fail /data/flows.test.yaml. Off by
  # default: a gate nobody asked for fails a deploy at 3 AM for a reason
  # nobody on shift has heard of.
  gate: false
  timeout: 2m           # wall clock for one run of the suite

# ── Authentication ───────────────────────────────────────────────────────────
# HotLoop Flow refuses to start without this. Leave passwordHash empty and the
# chart generates a password on first install and keeps it across upgrades.
auth:
  enabled: true
  username: admin
  password: ""          # plaintext; hashed into a Secret at install time
  passwordHash: ""      # pre-computed bcrypt hash, wins over password
  sessionTTL: 168h

# ── Dashboard sign-in ────────────────────────────────────────────────────────
# The EmberCORE dashboard signs people in to the editor. It sends a token it
# signed (ES256, valid for 60 seconds) in X-Embernet-Assertion on every request
# it proxies, the editor's websocket included, and Flow checks it with the
# public key below: issuer, audience (this app in this tenant) and expiry. The
# permission comes from the tenant's role map in the dashboard: "*" is full
# access, "read" is read-only. Bearer tokens and the admin login keep working
# beside it, which is the break-glass for staff and automation.
#
# The App Store fills this in on a deploy. With publicKey empty none of it
# renders and Flow is what it always was. Only the PUBLIC key is ever here.
embernetSignin:
  # "assertion" when the dashboard signs people in
  driver: ""
  # PKIX PEM, the dashboard's ES256 public key
  publicKey: ""
  algorithm: ES256
  header: X-Embernet-Assertion
  issuer: embernet-dashboard
  # The audience a token must name, <tenant>/<Service>. Worked out from the
  # tenant-<id> namespace and the release name; set it only when the release is
  # in no tenant-<id> namespace and carries no tenant label.
  audience: ""
  # The editor says it is opened from the dashboard instead of offering its own
  # sign-in form. The API's own sign-in and bearer tokens are untouched.
  hideLoginForm: true

# credentialSecret encrypts node credentials at rest.
#
# Generated on first install and preserved across upgrades by reading the
# existing Secret back. If it ever regenerates, every stored credential becomes
# undecryptable — which is why this is not a plain randAlphaNum.
hotloopFlow:
  credentialSecret: ""

# ── Runtime ──────────────────────────────────────────────────────────────────
runtime:
  inboxCapacity: 1024
  # block | drop-newest | drop-oldest | error
  overflow: block
  blockTimeout: 30s
  closeTimeout: 15s

logging:
  level: info      # error | warn | info | debug | trace
  format: json     # json for a cluster, text for a terminal

metrics:
  enabled: true
  path: /metrics
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# ── Scheduling ───────────────────────────────────────────────────────────────
# Injected by DeployApp to pin the workload to the selected node. Hardcoding it
# defeats the per-node deployment model.
nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

# ── Security ─────────────────────────────────────────────────────────────────
# distroless nonroot. The binary is static and needs nothing from the image.
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ── Probes ───────────────────────────────────────────────────────────────────
# /health is unauthenticated so the kubelet can reach it. /ready reports the
# runtime separately, so a runtime that failed to start leaves the Service
# without the kubelet restart-looping the pod.
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Extra environment, for anything not modelled above.
env: []
envFrom: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1
