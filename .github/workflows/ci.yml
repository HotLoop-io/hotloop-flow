name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go mod tidy is committed
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build the WASM test guest
        # The sandbox tests need a real guest. Built here rather than committed,
        # because a 3MB binary artefact in the repo would be reviewed by nobody
        # and could drift from the source beside it. Without this the wasmhost
        # tests skip, and a skipped sandbox test is not a passing one.
        run: |
          GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared \
            -o testdata/wasmguest/guest.wasm ./testdata/wasmguest
          test -s testdata/wasmguest/guest.wasm

      - name: Start a real MQTT broker
        # The MQTT tests talk to a real broker or they skip, and until this step
        # existed they skipped here every time. The partial deploy test counts
        # the broker's birth messages to prove a deploy kept the session up,
        # which a fake broker could only pretend to answer.
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            eclipse-mosquitto:2.1.2-alpine mosquitto -c /mosquitto-no-auth.conf
          for i in $(seq 1 30); do nc -z localhost 1883 && exit 0; sleep 1; done
          docker logs mosquitto; exit 1

      - name: Fetch the published JSONata test suite
        # The suite is jsonata-js's own, cloned at the pinned tag and checked
        # against the commit the tag pointed at when the expected count was
        # written down. Cloned rather than committed for the same reason the
        # WASM guest is built rather than committed: 1,347 files of somebody
        # else's test data in this repository would be reviewed by nobody.
        run: |
          git -c advice.detachedHead=false clone -q --depth 1 --branch v2.2.2 \
            https://github.com/jsonata-js/jsonata.git "$RUNNER_TEMP/jsonata-js"
          test "$(git -C "$RUNNER_TEMP/jsonata-js" rev-parse HEAD)" = 6c7e95fdbf4405a1e741852a7cd8cd985b4305bb
          echo "HOTLOOP_FLOW_JSONATA_SUITE=$RUNNER_TEMP/jsonata-js/test/test-suite" >> "$GITHUB_ENV"

      - name: Start a Mosquitto that requires a password
        # The rollback test deletes an MQTT subscriber, rolls back, and checks
        # it logs in again with the password the deployment record kept. This
        # broker refuses anonymous clients, so a rollback that lost the
        # password fails here instead of passing by accident. It sits on 1884
        # beside the open one above.
        run: |
          M="$RUNNER_TEMP/mosq"
          mkdir -p "$M" && chmod 0755 "$M"
          {
            echo 'listener 1883'
            echo 'allow_anonymous false'
            echo 'password_file /mosquitto/config/passwd'
          } > "$M/mosquitto.conf"
          touch "$M/passwd"
          sudo podman run --rm -v "$M:/mosquitto/config" docker.io/library/eclipse-mosquitto:2 \
            mosquitto_passwd -b /mosquitto/config/passwd line3 ci-broker-pass
          sudo chown 1883:1883 "$M/passwd" && sudo chmod 0700 "$M/passwd"
          sudo podman run -d --name mosquitto-auth -p 127.0.0.1:1884:1883 -v "$M:/mosquitto/config" docker.io/library/eclipse-mosquitto:2
          for i in $(seq 1 20); do (echo > /dev/tcp/127.0.0.1/1884) 2>/dev/null && break; sleep 1; done
          sudo podman logs mosquitto-auth

      - name: Test with race detector
        # The race detector needs cgo. This is the test build only — the shipped
        # binary is built CGO_ENABLED=0 in the Dockerfile so it stays static and
        # runs on distroless.
        env:
          CGO_ENABLED: "1"
          HOTLOOP_FLOW_TEST_MQTT: localhost:1883
          HOTLOOP_FLOW_TEST_MQTT_AUTH: 127.0.0.1:1884
          HOTLOOP_FLOW_TEST_MQTT_USER: line3
          HOTLOOP_FLOW_TEST_MQTT_PASSWORD: ci-broker-pass
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: The broker test actually ran
        # A skipped integration test reads as a passing one. This is the test
        # behind "a rollback brings the broker password back".
        env:
          HOTLOOP_FLOW_TEST_MQTT_AUTH: 127.0.0.1:1884
          HOTLOOP_FLOW_TEST_MQTT_USER: line3
          HOTLOOP_FLOW_TEST_MQTT_PASSWORD: ci-broker-pass
        run: |
          OUT=$(go test ./cmd/hotloop-flow/ -count=1 -v -run TestIntegrationRollbackLogsBackInToARealBroker 2>&1)
          echo "$OUT" | tail -5
          if echo "$OUT" | grep -q -- "--- SKIP"; then
            echo "::error::the broker rollback test was skipped"; exit 1
          fi
          echo "$OUT" | grep -q -- "--- PASS: TestIntegrationRollbackLogsBackInToARealBroker" || {
            echo "::error::the broker rollback test did not pass"; exit 1; }

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: The sandbox tests actually ran
        # A skipped test reads as a passing one in the summary. These are the
        # tests behind the security claims in the README, so assert they
        # executed rather than trusting that they did.
        run: |
          OUT=$(go test ./internal/wasmhost/ -count=1 -v -run TestWasm 2>&1)
          echo "$OUT" | tail -20
          if echo "$OUT" | grep -q "SKIP"; then
            echo "::error::wasmhost tests were skipped; the guest did not build"
            exit 1
          fi
          echo "$OUT" | grep -q "TestWasmMemoryCeilingIsEnforced" || {
            echo "::error::the memory ceiling test did not run"; exit 1; }

      - name: The MQTT tests actually ran
        # Same reasoning as the sandbox check: a broker that failed to come up
        # turns every MQTT test into a skip, and a skip reads as a pass.
        env:
          HOTLOOP_FLOW_TEST_MQTT: localhost:1883
        run: |
          OUT=$(go test ./cmd/hotloop-flow/ ./internal/nodes/ -count=1 -v -run 'MQTT' 2>&1)
          echo "$OUT" | grep -E '^(---|ok|FAIL)'
          if echo "$OUT" | grep -q -- "--- SKIP"; then
            echo "::error::an MQTT test skipped; the broker is not reachable"
            exit 1
          fi
          for t in TestPartialDeployKeepsTheMQTTSessionUp TestIntegrationMQTTRoundTrip; do
            echo "$OUT" | grep -q -- "--- PASS: $t" || { echo "::error::$t did not pass"; exit 1; }
          done

      - name: The JSONata suite actually ran
        # A missing suite turns the test into a skip, and a skip reads as a
        # pass. The count is the claim the README makes, so check it here.
        run: |
          OUT=$(go test ./internal/jsonata/ -count=1 -v -run TestPublishedJSONataSuite 2>&1)
          echo "$OUT" | grep -E 'published suite|^(---|ok|FAIL)'
          echo "$OUT" | grep -q -- "--- PASS: TestPublishedJSONataSuite" || {
            echo "::error::the JSONata suite did not run and pass"; exit 1; }
          echo "$OUT" | grep -q "1673 of 1686 cases pass" || {
            echo "::error::the JSONata pass count is not the one the docs state"; exit 1; }

  chart:
    name: Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: helm lint
        run: helm lint charts/hotloop-flow

      - name: The generated admin password matches its hash
        # The chart generates an admin password and prints how to read it, so the
        # hash the app checks against has to be a hash of that password. It was
        # not, from 0.1.0 through 2.0.1: the hash helper drew its own random
        # password on a first install, so the login in the install notes never
        # worked, and nothing before a live cluster could see it because both
        # values are random. This renders the chart the way a first install does
        # and asks bcrypt whether the two agree.
        run: |
          command -v htpasswd >/dev/null || sudo apt-get install -y apache2-utils >/dev/null
          check() {
            helm template t charts/hotloop-flow "$@" > render.yaml
            PW=$(awk '/admin-password:/ {gsub(/"/,"",$2); print $2}' render.yaml | base64 -d)
            HASH=$(awk '/admin-password-hash:/ {gsub(/"/,"",$2); print $2}' render.yaml | base64 -d)
            test -n "$PW" && test -n "$HASH" || { echo "::error::no password or hash rendered"; exit 1; }
            printf 'admin:%s\n' "$HASH" > htpasswd.txt
            htpasswd -vb htpasswd.txt admin "$PW" || { echo "::error::the hash does not match the password ($*)"; exit 1; }
          }
          # random each time, so more than once
          check
          check
          check
          # and a password the operator chose
          check --set auth.password=a-password-somebody-chose

      - name: An explicit hash is used exactly as given
        run: |
          HASH='$2a$10$abcdefghijklmnopqrstuuABCDEFGHIJKLMNOPQRSTUVWXYZ01234'
          GOT=$(helm template t charts/hotloop-flow --set "auth.passwordHash=$HASH"             | awk '/admin-password-hash:/ {gsub(/"/,"",$2); print $2}' | base64 -d)
          test "$GOT" = "$HASH" || { echo "::error::explicit hash was altered: $GOT"; exit 1; }

      - name: Tenant labels reach every resource, and only when asked for
        # The EmberNET dashboard passes tenantLabels on an App Store deploy and expects
        # them on everything the chart renders. This chart ignored the value until
        # 2.0.3, and nothing said so: the labels just were not there on the cluster.
        # Seven places carry it: six resources, and the Deployment's pod template.
        run: |
          N=$(helm template t charts/hotloop-flow | grep -c 'embernet.ai/tenant' || true)
          [ "$N" = 0 ] || { echo "::error::a default render carries a tenant label ($N)"; exit 1; }
          helm template t charts/hotloop-flow --set-string 'tenantLabels.embernet\.ai/tenant=acme' > tenant.yaml
          N=$(grep -c 'embernet.ai/tenant: "acme"' tenant.yaml || true)
          [ "$N" = 7 ] || { echo "::error::expected the tenant label in 7 places, found $N"; exit 1; }

      - name: Discovery adds no capabilities
        # Up to 2.0.4 turning discovery on handed the pod NET_RAW and NET_ADMIN
        # for ARP sweeps that were never written: scan only makes TCP
        # connections. A capability nothing uses is attack surface, so every
        # render keeps them all dropped, and adding one back fails here.
        run: |
          for args in "" "--set discovery.enabled=true --set discovery.allowedCIDRs={10.0.0.0/24}"; do
            helm template t charts/hotloop-flow $args > caps.yaml
            if awk '/capabilities:/{c=1} c&&/add:/{f=1} /^ *[a-zA-Z]+:/&&!/capabilities:|drop:|add:/{c=0} END{exit !f}' caps.yaml; then
              echo "::error::the chart adds a capability ($args)"; exit 1
            fi
            grep -q 'NET_RAW\|NET_ADMIN' caps.yaml && { echo "::error::NET_RAW or NET_ADMIN in the render ($args)"; exit 1; }
            grep -A2 'capabilities:' caps.yaml | grep -q -- '- ALL' || { echo "::error::capabilities no longer drop ALL ($args)"; exit 1; }
          done

  static-build:
    name: Static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # web/src/tokens.css is a vendored copy of the canonical file in
      # HotLoop-io/HotLoop-io. If they drift, fail here rather than ship an editor
      # whose colors quietly disagree with the brand standard.
      - name: Design tokens match the canonical copy
        run: |
          curl -fsSL https://raw.githubusercontent.com/HotLoop-io/HotLoop-io/main/brand/tokens.css -o "$RUNNER_TEMP/canonical-tokens.css"
          diff -u --strip-trailing-cr "$RUNNER_TEMP/canonical-tokens.css" web/src/tokens.css

      - name: Type-check and build the editor bundle
        # The other jobs compile against the committed placeholder, which is
        # enough for vet and tests. This job must not: it reports the binary
        # size and enforces the budget, and a binary carrying a 200-byte
        # placeholder instead of the real editor would report a size that is
        # not the shipped one and pass a budget it was never tested against.
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
          test -s dist/index.html

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: go build -trimpath -ldflags="-s -w" -buildvcs=false -o hotloop-flow ./cmd/hotloop-flow

      - name: The editor is actually in the binary
        # web.Assets falls back to a plain-text explanation when the bundle is
        # missing, which is the right runtime behaviour and the wrong thing to
        # ship silently. The FOUC guard is the marker: it is the first thing in
        # the built index.html, it is not in any Go source, and it cannot be
        # present unless the real bundle was embedded.
        run: |
          if ! grep -qa "FOUC guard" hotloop-flow; then
            echo "::error::the editor bundle is not embedded in the binary"
            exit 1
          fi

      - name: Report binary size
        # The whole premise of this project is that it is small. If the binary
        # grows past the budget, that is a finding, not a footnote.
        run: |
          SIZE=$(stat -c%s hotloop-flow)
          echo "hotloop-flow: $SIZE bytes ($((SIZE/1024/1024)) MiB)"
          echo "### Binary size: $((SIZE/1024/1024)) MiB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt 41943040 ]; then
            echo "::error::binary exceeds the 40 MiB budget"
            exit 1
          fi

      - name: Confirm the binary is actually static
        run: |
          file hotloop-flow
          if file hotloop-flow | grep -q "dynamically linked"; then
            echo "::error::binary is dynamically linked; it will not run on distroless/static"
            exit 1
          fi

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Fuzz the property expression parser
        # Parses attacker-influenced input from the admin API. A short run on
        # every PR catches regressions; the corpus in testdata carries anything
        # a longer run has already found.
        run: go test ./internal/engine/ -run=XXX -fuzz=FuzzParsePath -fuzztime=60s

      - name: Fuzz the semantic diff
        # A flow compared with itself must be no change at all, for any
        # document the parser accepts. If that ever fails, every review and
        # every rollback built on the diff is showing somebody a change that
        # isn't there.
        run: go test ./internal/flowdiff/ -run=XXX -fuzz=FuzzDiffOfAFlowWithItselfIsEmpty -fuzztime=30s

  editor:
    name: Editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/e2e/package-lock.json

      - name: Build the editor into the binary
        # The browser tests drive the binary that ships, editor embedded, not a
        # dev server and not a mock of the API.
        run: |
          (cd web && npm ci && npm run build)
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o hotloop-flow ./cmd/hotloop-flow

      - name: Install the browser and the test runner
        # A dev dependency of web/e2e only. Nothing in it reaches the bundle or
        # the image.
        working-directory: web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Click through review, history, rollback and conflicts
        working-directory: web/e2e
        run: npx playwright test
