name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go mod tidy is committed
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build the WASM test guest
        # The sandbox tests need a real guest. Built here rather than committed,
        # because a 3MB binary artefact in the repo would be reviewed by nobody
        # and could drift from the source beside it. Without this the wasmhost
        # tests skip, and a skipped sandbox test is not a passing one.
        run: |
          GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared \
            -o testdata/wasmguest/guest.wasm ./testdata/wasmguest
          test -s testdata/wasmguest/guest.wasm

      - name: Start a real MQTT broker
        # The MQTT tests talk to a real broker or they skip, and until this step
        # existed they skipped here every time. The partial deploy test counts
        # the broker's birth messages to prove a deploy kept the session up,
        # which a fake broker could only pretend to answer.
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            eclipse-mosquitto:2.1.2-alpine mosquitto -c /mosquitto-no-auth.conf
          for i in $(seq 1 30); do nc -z localhost 1883 && exit 0; sleep 1; done
          docker logs mosquitto; exit 1

      - name: Fetch the published JSONata test suite
        # The suite is jsonata-js's own, cloned at the pinned tag and checked
        # against the commit the tag pointed at when the expected count was
        # written down. Cloned rather than committed for the same reason the
        # WASM guest is built rather than committed: 1,347 files of somebody
        # else's test data in this repository would be reviewed by nobody.
        run: |
          git -c advice.detachedHead=false clone -q --depth 1 --branch v2.2.2 \
            https://github.com/jsonata-js/jsonata.git "$RUNNER_TEMP/jsonata-js"
          test "$(git -C "$RUNNER_TEMP/jsonata-js" rev-parse HEAD)" = 6c7e95fdbf4405a1e741852a7cd8cd985b4305bb
          echo "HOTLOOP_FLOW_JSONATA_SUITE=$RUNNER_TEMP/jsonata-js/test/test-suite" >> "$GITHUB_ENV"

      - name: Start a Mosquitto that requires a password
        # The rollback test deletes an MQTT subscriber, rolls back, and checks
        # it logs in again with the password the deployment record kept. This
        # broker refuses anonymous clients, so a rollback that lost the
        # password fails here instead of passing by accident. It sits on 1884
        # beside the open one above.
        run: |
          M="$RUNNER_TEMP/mosq"
          mkdir -p "$M" && chmod 0755 "$M"
          {
            echo 'listener 1883'
            echo 'allow_anonymous false'
            echo 'password_file /mosquitto/config/passwd'
          } > "$M/mosquitto.conf"
          touch "$M/passwd"
          sudo podman run --rm -v "$M:/mosquitto/config" docker.io/library/eclipse-mosquitto:2 \
            mosquitto_passwd -b /mosquitto/config/passwd line3 ci-broker-pass
          sudo chown 1883:1883 "$M/passwd" && sudo chmod 0700 "$M/passwd"
          sudo podman run -d --name mosquitto-auth -p 127.0.0.1:1884:1883 -v "$M:/mosquitto/config" docker.io/library/eclipse-mosquitto:2
          for i in $(seq 1 20); do (echo > /dev/tcp/127.0.0.1/1884) 2>/dev/null && break; sleep 1; done
          sudo podman logs mosquitto-auth

      - name: Start a real OpenTelemetry collector
        # The tracing export is tested against the stock collector image, not a
        # stand-in for one, with the config in testdata/otel mounted over its
        # own: an OTLP/HTTP receiver, and the debug exporter printing every span
        # it accepts into a file the test reads back. The image is pinned to a
        # release, so a collector change shows up as a version bump in a PR.
        run: |
          docker run -d --name otel -p 4318:4318             -v "$PWD/testdata/otel/collector.yaml:/etc/otelcol/config.yaml:ro"             otel/opentelemetry-collector:0.163.1 --config /etc/otelcol/config.yaml
          : > "$RUNNER_TEMP/otel.log"
          nohup docker logs -f otel > "$RUNNER_TEMP/otel.log" 2>&1 &
          for _ in $(seq 1 30); do grep -q "Everything is ready" "$RUNNER_TEMP/otel.log" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/otel.log"; exit 1

      - name: Start a real Modbus TCP server and a real OPC UA server
        # The Modbus and OPC UA tests talk to real servers or they skip, and a
        # skip reads as a pass. Modbus is oitc/modbus-server (pymodbus) with the
        # registers in testdata/plant/modbus_server.json. OPC UA is Microsoft's
        # OPC PLC with the tags in testdata/plant/opcplc_nodes.json and a login
        # of flowuser/flowpass. Both versions are pinned: a simulator that
        # changes under the tests is a failure nobody can read.
        run: |
          docker run -d --name modbus -p 5020:5020 \
            -v "$PWD/testdata/plant/modbus_server.json:/app/modbus_server.json:ro" \
            docker.io/oitc/modbus-server:2.3.0
          docker run -d --name opcplc -p 50000:50000 \
            -v "$PWD/testdata/plant/opcplc_nodes.json:/cfg/nodes.json:ro" \
            mcr.microsoft.com/iotedge/opc-plc:2.15.11 \
            --pn=50000 --autoaccept --unsecuretransport \
            --defaultuser=flowuser --defaultpassword=flowpass \
            --heartbeats --nodesfile=/cfg/nodes.json \
            --fastnodes=1 --fastrate=1 --fasttype=UInt --slownodes=1 --slowrate=1 --slowtype=UInt
          for p in 5020 50000; do
            for i in $(seq 1 60); do nc -z localhost $p && break; sleep 1; done
            nc -z localhost $p || { docker logs modbus; docker logs opcplc; echo "::error::nothing on $p"; exit 1; }
          done
          sleep 5

      - name: Start a second MQTT broker
        # The Sparkplug test that moves an edge node from one broker to the
        # next needs a second broker, with no password, on its own port.
        run: |
          docker run -d --name mosquitto2 -p 1885:1883 \
            eclipse-mosquitto:2.1.2-alpine mosquitto -c /mosquitto-no-auth.conf
          for i in $(seq 1 30); do nc -z localhost 1885 && exit 0; sleep 1; done
          docker logs mosquitto2; exit 1

      - name: Start a real S7 server and a real EtherNet/IP server
        # The S7 and EtherNet/IP tests talk to real servers or they skip, and a
        # skip reads as a pass. The S7 server is python-snap7 3.2.1 (MIT), a
        # server for the S7 protocol written in pure Python, built from
        # testdata/plant/s7. The EtherNet/IP server is ab_server from libplctag
        # 2.7.2, built from testdata/plant/ethernetip at a pinned commit and
        # started with the tags the tests use. Both run as separate programs
        # and nothing from either is linked into Flow. The tags are lower case
        # because ab_server matches them with their case and the client sends
        # them lower case.
        run: |
          docker build -q -t flow-s7sim testdata/plant/s7
          docker build -q -t flow-enipsim testdata/plant/ethernetip
          docker run -d --name s7sim -p 1102:102 flow-s7sim
          docker run -d --name enipsim -p 44818:44818 flow-enipsim \
            --plc=ControlLogix --path=1,0 \
            --tag=testsint:SINT[1] --tag=testint:INT[1] --tag=testdint:DINT[1] --tag=testlint:LINT[1] \
            --tag=testreal:REAL[1] --tag=testlreal:LREAL[1] --tag=testbool:BOOL[1] --tag=teststring:STRING[1] \
            --tag=testdintarr:DINT[10] --tag=testrealarr:REAL[5]
          for p in 1102 44818; do
            for i in $(seq 1 60); do nc -z localhost $p && break; sleep 1; done
            nc -z localhost $p || { docker logs s7sim; docker logs enipsim; echo "::error::nothing on $p"; exit 1; }
          done
          sleep 3

      - name: Fetch the Sparkplug B schema
        # The Sparkplug tests compile Eclipse's own schema and read and write the
        # wire with Google's protobuf, which is how a hand-written encoder gets
        # checked by something that isn't itself. The file is EPL-2.0, so it is
        # fetched at a commit and checked against a hash instead of sitting in
        # this repository, the same way the JSONata suite is.
        run: |
          curl -fsSL "https://raw.githubusercontent.com/eclipse/tahu/46f25e79f34234e6145d11108660dfd9133ae50d/sparkplug_b/sparkplug_b.proto" -o "$RUNNER_TEMP/sparkplug_b.proto"
          echo "4432c5c483b7fb9732d0594c98a2e97dca5e517e39c5374a8b918d837f0b4a19  $RUNNER_TEMP/sparkplug_b.proto" | sha256sum -c -
          echo "HOTLOOP_FLOW_SPARKPLUG_PROTO=$RUNNER_TEMP/sparkplug_b.proto" >> "$GITHUB_ENV"

      - name: Test with race detector
        # The race detector needs cgo. This is the test build only — the shipped
        # binary is built CGO_ENABLED=0 in the Dockerfile so it stays static and
        # runs on distroless.
        env:
          CGO_ENABLED: "1"
          HOTLOOP_FLOW_TEST_MQTT: localhost:1883
          HOTLOOP_FLOW_TEST_MQTT_AUTH: 127.0.0.1:1884
          HOTLOOP_FLOW_TEST_MQTT_USER: line3
          HOTLOOP_FLOW_TEST_MQTT_PASSWORD: ci-broker-pass
          HOTLOOP_FLOW_TEST_OTLP: localhost:4318
          HOTLOOP_FLOW_TEST_OTLP_LOG: ${{ runner.temp }}/otel.log
          HOTLOOP_FLOW_TEST_MQTT2: localhost:1885
          HOTLOOP_FLOW_TEST_MODBUS: localhost:5020
          HOTLOOP_FLOW_TEST_OPCUA: localhost:50000
          HOTLOOP_FLOW_TEST_S7: localhost:1102
          HOTLOOP_FLOW_TEST_ENIP: localhost:44818
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: The broker tests actually ran
        # A skipped integration test reads as a passing one. These are the tests
        # behind "a rollback brings the broker password back" and "a broker
        # password can live in a mounted Secret".
        env:
          HOTLOOP_FLOW_TEST_MQTT_AUTH: 127.0.0.1:1884
          HOTLOOP_FLOW_TEST_MQTT_USER: line3
          HOTLOOP_FLOW_TEST_MQTT_PASSWORD: ci-broker-pass
        run: |
          OUT=$(go test ./cmd/hotloop-flow/ -count=1 -v \
            -run 'TestIntegrationRollbackLogsBackInToARealBroker|TestIntegrationPasswordFromAMountedSecret' 2>&1)
          echo "$OUT" | grep -E '^(---|ok|FAIL)'
          if echo "$OUT" | grep -q -- "--- SKIP"; then
            echo "::error::a broker test was skipped"; exit 1
          fi
          for t in TestIntegrationRollbackLogsBackInToARealBroker TestIntegrationPasswordFromAMountedSecret; do
            echo "$OUT" | grep -q -- "--- PASS: $t" || { echo "::error::$t did not pass"; exit 1; }
          done

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: The sandbox tests actually ran
        # A skipped test reads as a passing one in the summary. These are the
        # tests behind the security claims in the README, so assert they
        # executed rather than trusting that they did.
        run: |
          OUT=$(go test ./internal/wasmhost/ -count=1 -v -run TestWasm 2>&1)
          echo "$OUT" | tail -20
          if echo "$OUT" | grep -q "SKIP"; then
            echo "::error::wasmhost tests were skipped; the guest did not build"
            exit 1
          fi
          echo "$OUT" | grep -q "TestWasmMemoryCeilingIsEnforced" || {
            echo "::error::the memory ceiling test did not run"; exit 1; }

      - name: The MQTT tests actually ran
        # Same reasoning as the sandbox check: a broker that failed to come up
        # turns every MQTT test into a skip, and a skip reads as a pass.
        env:
          HOTLOOP_FLOW_TEST_MQTT: localhost:1883
        run: |
          OUT=$(go test ./cmd/hotloop-flow/ ./internal/nodes/ -count=1 -v -run 'MQTT' 2>&1)
          echo "$OUT" | grep -E '^(---|ok|FAIL)'
          if echo "$OUT" | grep -q -- "--- SKIP"; then
            echo "::error::an MQTT test skipped; the broker is not reachable"
            exit 1
          fi
          for t in TestPartialDeployKeepsTheMQTTSessionUp TestIntegrationMQTTRoundTrip \
            TestMQTTWillOnAConnectionThatDies TestMQTTCleanCloseSendsTheCloseMessageAndNoWill \
            TestMQTTv5PropertiesBothWays TestMQTTv5SubscriptionOptions \
            TestMQTTv5SessionExpiryKeepsMessagesAcrossADrop TestMQTTTwoNodesOnOneTopic \
            TestMQTTv5OverlappingSubscriptionsDeliverOnce TestMQTTv311StillRoundTrips \
            TestMQTTOverTLSWithATLSConfig; do
            echo "$OUT" | grep -q -- "--- PASS: $t" || { echo "::error::$t did not pass"; exit 1; }
          done

      - name: The Modbus and OPC UA tests actually ran
        # Same reasoning as the MQTT check: a simulator that failed to come up
        # turns every one of these into a skip, and a skip reads as a pass.
        env:
          HOTLOOP_FLOW_TEST_MODBUS: localhost:5020
          HOTLOOP_FLOW_TEST_OPCUA: localhost:50000
        run: |
          OUT=$(go test ./internal/nodes/ -count=1 -v -run 'Modbus|OPCUA' 2>&1)
          echo "$OUT" | grep -E '^(---|ok|FAIL)'
          if echo "$OUT" | grep -q -- "--- SKIP"; then
            echo "::error::a Modbus or OPC UA test skipped; the simulator is not reachable"
            exit 1
          fi
          for t in TestModbusReadsWhatTheRealServerHolds \
            TestModbusWriteIsReadBackFromTheRealServer \
            TestModbusServerSaysNoAndTheErrorSaysWhatToDo \
            TestModbusDeviceGoesSilentThenComesBack \
            TestOPCUAWriteIsReadBackFromTheRealServer \
            TestOPCUAServerSaysNoAndTheErrorSaysWhatToDo \
            TestOPCUASecurityModesPoliciesAndLogins \
            TestOPCUAClientCertificateFromATLSConfig \
            TestOPCUASubscribeDeliversTheServersChanges \
            TestOPCUASubscriptionSurvivesTheServerGoingSilentAndDownAndComingBack \
            TestOPCUAReadDuringSilenceTimesOutAndRecovers \
            TestOPCUAHungDiscoveryDoesNotLockOutTheOtherNodes \
            TestOPCUAConcurrentNodesShareOneSession \
            TestOPCUAAes256RsaPssWaitsOnGopcua; do
            echo "$OUT" | grep -q -- "--- PASS: $t" || { echo "::error::$t did not pass"; exit 1; }
          done

      - name: The Sparkplug tests actually ran
        # Same reasoning as the MQTT check: a broker that is not there, or a
        # schema that did not download, turns every one of these into a skip.
        env:
          HOTLOOP_FLOW_TEST_MQTT: localhost:1883
          HOTLOOP_FLOW_TEST_MQTT2: localhost:1885
        run: |
          OUT=$(go test ./internal/nodes/ -count=1 -v -run Sparkplug 2>&1)
          echo "$OUT" | grep -E '^(---|ok|FAIL)'
          if echo "$OUT" | grep -q -- "--- SKIP"; then
            echo "::error::a Sparkplug test skipped; the broker or the schema is missing"
            exit 1
          fi
          for t in TestSparkplugBytesAreWhatTheEclipseSchemaSays \
            TestSparkplugEdgeNodeAndHostTalkThroughARealBroker \
            TestSparkplugNDEATHComesFromTheBrokerAndTheNextBirthHasANewBdSeq \
            TestSparkplugHostAsksForARebirthAndCommandsReachTheEdgeNode \
            TestSparkplugHostApplicationStateIsRetainedAndItsWillSaysOffline \
            TestSparkplugHostReadsAnotherImplementationsAliasesGapsAndStrangers \
            TestSparkplugAGapThatFillsInWithinTheReorderTimeoutCostsNoRebirth \
            TestSparkplugHostStartedAfterTheEdgeNodeGetsItsBirthByAsking \
            TestSparkplugAliasesBothWays \
            TestSparkplugComplexValuesAreWhatTheEclipseSchemaSays \
            TestSparkplugEdgeNodePublishesArraysDataSetsTemplatesAndPropertiesToAHost \
            TestSparkplugTemplateInstanceNeedsItsDefinitionInTheNBirth \
            TestSparkplugEdgeNodeWaitsForItsPrimaryHostBeforeItIsBorn \
            TestSparkplugEdgeNodeLeavesWhenItsPrimaryHostGoesOfflineAndIgnoresALateDeath \
            TestSparkplugEdgeNodeMovesToTheBrokerWhereThePrimaryHostIs \
            TestSparkplugEdgeNodeGoesToTheNextBrokerWhenTheFirstIsGone; do
            echo "$OUT" | grep -q -- "--- PASS: $t" || { echo "::error::$t did not pass"; exit 1; }
          done

      - name: The OpenSSL interop test actually ran
        # The PKCS#12 bundle and encrypted key that test reads are written by
        # the openssl on the runner, which is the point: a file from the tool a
        # site's IT department uses, not from the library that reads it back.
        # Without openssl it skips, and a skip reads as a pass.
        run: |
          OUT=$(go test ./internal/nodes/ -count=1 -v -run TestTLSConfigReadsWhatOpenSSLWrites 2>&1)
          echo "$OUT" | grep -E '^(---|ok|FAIL)'
          if echo "$OUT" | grep -q -- "--- SKIP"; then
            echo "::error::the OpenSSL interop test skipped"; exit 1
          fi
          echo "$OUT" | grep -q -- "--- PASS: TestTLSConfigReadsWhatOpenSSLWrites" || {
            echo "::error::the OpenSSL interop test did not pass"; exit 1; }

      - name: The collector actually received the spans
        # No collector turns the test into a skip, and a skip reads as a pass.
        env:
          HOTLOOP_FLOW_TEST_OTLP: localhost:4318
          HOTLOOP_FLOW_TEST_OTLP_LOG: ${{ runner.temp }}/otel.log
        run: |
          OUT=$(go test ./internal/otlp/ -count=1 -v -run TestSpansReachARealCollector 2>&1)
          echo "$OUT" | grep -E 'reached the collector|^(---|ok|FAIL)'
          if echo "$OUT" | grep -q -- "--- SKIP"; then
            echo "::error::the collector test skipped; the collector is not reachable"; exit 1
          fi
          echo "$OUT" | grep -q -- "--- PASS: TestSpansReachARealCollector" || {
            echo "::error::the collector test did not pass"; exit 1; }
          echo "### Spans the real collector received" >> "$GITHUB_STEP_SUMMARY"
          grep -c '^Span #' "$RUNNER_TEMP/otel.log" >> "$GITHUB_STEP_SUMMARY"

      - name: A million messages through the tracer
        # The README says tracing every message through a flow keeps memory flat,
        # and the number is published. The race run above does 50,000; this is
        # the million, without the race detector so it finishes in seconds.
        # Anything that stops the heap being flat fails the test itself.
        env:
          HOTLOOP_FLOW_SOAK_MESSAGES: "1000000"
          HOTLOOP_FLOW_SOAK_OUT: ${{ runner.temp }}/soak.txt
        run: |
          go test ./internal/runtime/ -count=1 -run TestTraceMemoryStaysFlatUnderASoak -v 2>&1 | grep -E '^(---|ok|FAIL)'
          cat "$HOTLOOP_FLOW_SOAK_OUT"
          { echo '### Trace soak'; echo '```'; cat "$HOTLOOP_FLOW_SOAK_OUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: The JSONata suite actually ran
        # A missing suite turns the test into a skip, and a skip reads as a
        # pass. The count is the claim the README makes, so check it here.
        run: |
          OUT=$(go test ./internal/jsonata/ -count=1 -v -run TestPublishedJSONataSuite 2>&1)
          echo "$OUT" | grep -E 'published suite|^(---|ok|FAIL)'
          echo "$OUT" | grep -q -- "--- PASS: TestPublishedJSONataSuite" || {
            echo "::error::the JSONata suite did not run and pass"; exit 1; }
          echo "$OUT" | grep -q "1673 of 1686 cases pass" || {
            echo "::error::the JSONata pass count is not the one the docs state"; exit 1; }

  chart:
    name: Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: helm lint
        run: helm lint charts/hotloop-flow

      - name: Tracing and store values reach the config the binary reads
        # values.yaml is a second copy of every setting in config.go, and a copy
        # drifts. This renders the chart, takes the config.yaml out of its
        # ConfigMap and loads it with the binary's own loader, which rejects keys
        # it does not know. The defaults must equal the binary's, and every
        # trace.* and store.* value must land in the field of the same name. A
        # skip reads as a pass, so a skip fails here.
        env:
          HOTLOOP_FLOW_TEST_HELM: "1"
        run: |
          OUT=$(go test ./internal/config/ -count=1 -v -run TestChart 2>&1)
          echo "$OUT" | grep -E "^(---|ok|FAIL)"
          if echo "$OUT" | grep -q -- "--- SKIP"; then
            echo "::error::a chart config test skipped"; exit 1
          fi
          for t in TestChartDefaultsAreTheConfigDefaults TestChartTraceAndStoreValuesReachTheConfig; do
            echo "$OUT" | grep -q -- "--- PASS: $t" || { echo "::error::$t did not pass"; exit 1; }
          done

      - name: A collector key comes from a Secret and never the ConfigMap
        # Headers for a hosted collector are an API key. They are only ever an
        # environment variable read from the Secret the operator names, and a
        # default render has none.
        run: |
          N=$(helm template t charts/hotloop-flow | grep -c HOTLOOP_FLOW_TRACE_OTLP_HEADERS || true)
          [ "$N" = 0 ] || { echo "::error::a default render sets the collector headers"; exit 1; }
          helm template t charts/hotloop-flow --set trace.otlp.headersSecret.name=otel-key > otel.yaml
          grep -A4 'name: HOTLOOP_FLOW_TRACE_OTLP_HEADERS' otel.yaml | grep -q 'name: otel-key' || { echo "::error::the headers do not come from the named Secret"; exit 1; }
          awk '/^---/{c=0} /config.yaml: \|/{c=1} c&&/headers/{f=1} END{exit f}' otel.yaml || { echo "::error::headers leaked into the ConfigMap"; exit 1; }

      - name: The generated admin password matches its hash
        # The chart generates an admin password and prints how to read it, so the
        # hash the app checks against has to be a hash of that password. It was
        # not, from 0.1.0 through 2.0.1: the hash helper drew its own random
        # password on a first install, so the login in the install notes never
        # worked, and nothing before a live cluster could see it because both
        # values are random. This renders the chart the way a first install does
        # and asks bcrypt whether the two agree.
        run: |
          command -v htpasswd >/dev/null || sudo apt-get install -y apache2-utils >/dev/null
          check() {
            helm template t charts/hotloop-flow "$@" > render.yaml
            PW=$(awk '/admin-password:/ {gsub(/"/,"",$2); print $2}' render.yaml | base64 -d)
            HASH=$(awk '/admin-password-hash:/ {gsub(/"/,"",$2); print $2}' render.yaml | base64 -d)
            test -n "$PW" && test -n "$HASH" || { echo "::error::no password or hash rendered"; exit 1; }
            printf 'admin:%s\n' "$HASH" > htpasswd.txt
            htpasswd -vb htpasswd.txt admin "$PW" || { echo "::error::the hash does not match the password ($*)"; exit 1; }
          }
          # random each time, so more than once
          check
          check
          check
          # and a password the operator chose
          check --set auth.password=a-password-somebody-chose

      - name: An explicit hash is used exactly as given
        run: |
          HASH='$2a$10$abcdefghijklmnopqrstuuABCDEFGHIJKLMNOPQRSTUVWXYZ01234'
          GOT=$(helm template t charts/hotloop-flow --set "auth.passwordHash=$HASH"             | awk '/admin-password-hash:/ {gsub(/"/,"",$2); print $2}' | base64 -d)
          test "$GOT" = "$HASH" || { echo "::error::explicit hash was altered: $GOT"; exit 1; }

      - name: Tenant labels reach every resource, and only when asked for
        # The EmberNET dashboard passes tenantLabels on an App Store deploy and expects
        # them on everything the chart renders. This chart ignored the value until
        # 2.0.3, and nothing said so: the labels just were not there on the cluster.
        # Seven places carry it: six resources, and the Deployment's pod template.
        run: |
          N=$(helm template t charts/hotloop-flow | grep -c 'embernet.ai/tenant' || true)
          [ "$N" = 0 ] || { echo "::error::a default render carries a tenant label ($N)"; exit 1; }
          helm template t charts/hotloop-flow --set-string 'tenantLabels.embernet\.ai/tenant=acme' > tenant.yaml
          N=$(grep -c 'embernet.ai/tenant: "acme"' tenant.yaml || true)
          [ "$N" = 7 ] || { echo "::error::expected the tenant label in 7 places, found $N"; exit 1; }

      - name: Discovery adds no capabilities
        # Up to 2.0.4 turning discovery on handed the pod NET_RAW and NET_ADMIN
        # for ARP sweeps that were never written: scan only makes TCP
        # connections. A capability nothing uses is attack surface, so every
        # render keeps them all dropped, and adding one back fails here.
        run: |
          for args in "" "--set discovery.enabled=true --set discovery.allowedCIDRs={10.0.0.0/24}"; do
            helm template t charts/hotloop-flow $args > caps.yaml
            if awk '/capabilities:/{c=1} c&&/add:/{f=1} /^ *[a-zA-Z]+:/&&!/capabilities:|drop:|add:/{c=0} END{exit !f}' caps.yaml; then
              echo "::error::the chart adds a capability ($args)"; exit 1
            fi
            grep -q 'NET_RAW\|NET_ADMIN' caps.yaml && { echo "::error::NET_RAW or NET_ADMIN in the render ($args)"; exit 1; }
            grep -A2 'capabilities:' caps.yaml | grep -q -- '- ALL' || { echo "::error::capabilities no longer drop ALL ($args)"; exit 1; }
          done

      - name: A mounted Secret is read-only, private and in the secret scope
        # ew_credentialFiles and the tls-config read through the secret scope,
        # so a mount that is not in it is a password the app cannot read, and
        # one in files.allowedPaths instead is a password any flow can. Both
        # mistakes are a line in a template, so the render is checked.
        run: |
          helm template t charts/hotloop-flow \
            --set 'secrets.mounts[0].secretName=plc-broker' \
            --set 'secrets.mounts[0].mountPath=/etc/hotloop-flow/secrets/plc-broker' > sec.yaml
          grep -A3 -- '- name: secret-0' sec.yaml | grep -q 'readOnly: true' || { echo "::error::the Secret is not mounted read-only"; exit 1; }
          grep -A3 -- '- name: secret-0' sec.yaml | grep -q 'secretName: plc-broker' || { echo "::error::the Secret volume is missing"; exit 1; }
          grep -A4 -- '- name: secret-0' sec.yaml | grep -q 'defaultMode: 0440' || { echo "::error::the Secret files are not group-only"; exit 1; }
          awk '/^    secrets:/{s=1} s&&/plc-broker/{f=1} /^    logging:/{s=0} END{exit !f}' sec.yaml || { echo "::error::the mount is not in secrets.allowedPaths"; exit 1; }
          awk '/^    files:/{s=1} s&&/plc-broker/{f=1} /^    secrets:/{s=0} END{exit f}' sec.yaml || { echo "::error::the mount leaked into files.allowedPaths"; exit 1; }
          N=$(helm template t charts/hotloop-flow | grep -c 'secret-0' || true)
          [ "$N" = 0 ] || { echo "::error::a default render mounts a Secret"; exit 1; }

  static-build:
    name: Static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # web/src/tokens.css is a vendored copy of the canonical file in
      # HotLoop-io/HotLoop-io. If they drift, fail here rather than ship an editor
      # whose colors quietly disagree with the brand standard.
      - name: Design tokens match the canonical copy
        run: |
          curl -fsSL https://raw.githubusercontent.com/HotLoop-io/HotLoop-io/main/brand/tokens.css -o "$RUNNER_TEMP/canonical-tokens.css"
          diff -u --strip-trailing-cr "$RUNNER_TEMP/canonical-tokens.css" web/src/tokens.css

      - name: Type-check and build the editor bundle
        # The other jobs compile against the committed placeholder, which is
        # enough for vet and tests. This job must not: it reports the binary
        # size and enforces the budget, and a binary carrying a 200-byte
        # placeholder instead of the real editor would report a size that is
        # not the shipped one and pass a budget it was never tested against.
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
          test -s dist/index.html

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: go build -trimpath -ldflags="-s -w" -buildvcs=false -o hotloop-flow ./cmd/hotloop-flow

      - name: The editor is actually in the binary
        # web.Assets falls back to a plain-text explanation when the bundle is
        # missing, which is the right runtime behaviour and the wrong thing to
        # ship silently. The FOUC guard is the marker: it is the first thing in
        # the built index.html, it is not in any Go source, and it cannot be
        # present unless the real bundle was embedded.
        run: |
          if ! grep -qa "FOUC guard" hotloop-flow; then
            echo "::error::the editor bundle is not embedded in the binary"
            exit 1
          fi

      - name: Report binary size
        # The whole premise of this project is that it is small. If the binary
        # grows past the budget, that is a finding, not a footnote.
        run: |
          SIZE=$(stat -c%s hotloop-flow)
          echo "hotloop-flow: $SIZE bytes ($((SIZE/1024/1024)) MiB)"
          echo "### Binary size: $((SIZE/1024/1024)) MiB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt 41943040 ]; then
            echo "::error::binary exceeds the 40 MiB budget"
            exit 1
          fi

      - name: Confirm the binary is actually static
        run: |
          file hotloop-flow
          if file hotloop-flow | grep -q "dynamically linked"; then
            echo "::error::binary is dynamically linked; it will not run on distroless/static"
            exit 1
          fi

  image:
    name: Image and its licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        # The license gate lives in the Dockerfile, so the only way to know a
        # PR didn't pull in a GPL module or an unlicensed npm package is to
        # build the image. Before this job the first build was the release.
        run: docker build -t hotloop-flow:ci .

      - name: THIRD_PARTY_LICENSES is in the image and covers both halves
        run: |
          id=$(docker create hotloop-flow:ci)
          docker cp "$id:/usr/share/doc/hotloop-flow" doc
          docker rm "$id" >/dev/null
          ls -l doc
          for f in LICENSE LICENSES/Apache-2.0.txt NOTICE THIRD_PARTY_LICENSES; do
            test -s "doc/$f" || { echo "::error::$f is missing from the image"; exit 1; }
          done
          grep -q '^github.com/dop251/goja ' doc/THIRD_PARTY_LICENSES || { echo "::error::the Go modules are not listed"; exit 1; }
          grep -q '^Editor bundle (npm)' doc/THIRD_PARTY_LICENSES || { echo "::error::the editor bundle section is missing"; exit 1; }
          grep -q 'SIL OPEN FONT LICENSE' doc/THIRD_PARTY_LICENSES || { echo "::error::the font licenses are missing"; exit 1; }

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Fuzz the property expression parser
        # Parses attacker-influenced input from the admin API. A short run on
        # every PR catches regressions; the corpus in testdata carries anything
        # a longer run has already found.
        run: go test ./internal/engine/ -run=XXX -fuzz=FuzzParsePath -fuzztime=60s

      - name: Fuzz the semantic diff
        # A flow compared with itself must be no change at all, for any
        # document the parser accepts. If that ever fails, every review and
        # every rollback built on the diff is showing somebody a change that
        # isn't there.
        run: go test ./internal/flowdiff/ -run=XXX -fuzz=FuzzDiffOfAFlowWithItselfIsEmpty -fuzztime=30s

  editor:
    name: Editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/e2e/package-lock.json

      - name: Build the editor into the binary
        # The browser tests drive the binary that ships, editor embedded, not a
        # dev server and not a mock of the API.
        run: |
          (cd web && npm ci && npm run build)
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o hotloop-flow ./cmd/hotloop-flow

      - name: Install the browser and the test runner
        # A dev dependency of web/e2e only. Nothing in it reaches the bundle or
        # the image.
        working-directory: web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Click through the editor
        # Review, history, rollback, conflicts and flow tests, then copy and paste,
        # import and export, subflows, groups, search, the debug filters, and every
        # node dialog the runtime offers. The dialog test reads its list of node
        # types from GET /nodes on the binary it is testing, so it cannot go stale.
        working-directory: web/e2e
        run: npx playwright test

      - name: The S7 and EtherNet/IP tests actually ran
        # Same reasoning as the Modbus and OPC UA check: a simulator that failed
        # to come up turns every one of these into a skip, and a skip reads as a
        # pass.
        env:
          HOTLOOP_FLOW_TEST_S7: localhost:1102
          HOTLOOP_FLOW_TEST_ENIP: localhost:44818
        run: |
          OUT=$(go test ./internal/nodes/ -count=1 -v -run 'S7|EtherNetIP' 2>&1)
          echo "$OUT" | grep -E '^(---|ok|FAIL)'
          if echo "$OUT" | grep -q -- "--- SKIP"; then
            echo "::error::an S7 or EtherNet/IP test skipped; the simulator is not reachable"
            exit 1
          fi
          for t in TestS7ReadsWhatTheRealServerHolds \
            TestS7WriteIsReadBackFromTheRealServer \
            TestS7StringsKeepTheirMaximumLength \
            TestS7ABitIsWrittenAsABitAndNotAsAByte \
            TestS7CPUSaysNoAndTheErrorSaysWhatToDo \
            TestS7DeviceGoesSilentThenComesBack \
            TestS7NodesShareOneConnectionAndTakeTurns \
            TestEtherNetIPWriteIsReadBackFromTheRealServer \
            TestEtherNetIPControllerSaysNoAndTheErrorSaysWhatToDo \
            TestEtherNetIPDeviceGoesSilentThenComesBack \
            TestEtherNetIPNodesShareOneConnectionAndTakeTurns; do
            echo "$OUT" | grep -q -- "--- PASS: $t" || { echo "::error::$t did not pass"; exit 1; }
          done
