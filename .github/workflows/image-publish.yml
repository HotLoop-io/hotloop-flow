name: Publish Image

# Version tags only.
#
# An image built from an untagged commit is an artefact nobody can point at: it
# exists in the registry, something on a plant floor can end up running it, and
# there is no version anybody can say out loud. Every image this repo publishes
# corresponds to exactly one tag.
#
# workflow_dispatch takes a tag as input rather than building whatever is on the
# branch, so the manual path cannot produce an untagged build either.
#
# Podman and Buildah, no Docker. The runner image ships Podman 4.9.3 and Buildah
# 1.33.7 (actions/runner-images, images/ubuntu/Ubuntu2404-Readme.md, image
# 20261012.334.1), which is why this is pinned to ubuntu-24.04 and not
# ubuntu-latest: the version of podman is part of what builds the release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build, e.g. v0.1.0'
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hotloop-io/hotloop-flow

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Refuse to build anything that is not a version tag
        # Belt and braces. The trigger above already restricts this, but a
        # future edit to the trigger would silently start publishing untagged
        # images again, and the registry does not forget. It has to be a whole
        # semantic version, because the tags below are cut out of it.
        run: |
          REF='${{ inputs.tag || github.ref_name }}'
          if printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "building $REF"
          else
            echo "::error::refusing to build '$REF'; images are published from version tags like v1.2.3 only"
            exit 1
          fi

      - name: Teach the runner to run arm64
        # What the usual qemu setup action does, with Podman: tonistiigi/binfmt
        # registers qemu-user for arm64 with the kernel, and the F flag lets it
        # work inside a build container. Pinned to a release.
        run: |
          sudo podman run --privileged --rm docker.io/tonistiigi/binfmt:qemu-v10.2.3-68 --install arm64
          test -e /proc/sys/fs/binfmt_misc/qemu-aarch64
          head -3 /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username '${{ github.actor }}' --password-stdin

      - name: Build each platform into one manifest list
        # One platform per podman build, each added to the same list. A single
        # build for both platforms has stamped the wrong variants on a manifest
        # list before, so the list is checked in the next step. arm64 because
        # the edge fleet is not all x86; the RT kernel and images already build
        # for aarch64. VERSION is the tag as pushed, with its v, which is what
        # the binary reports.
        run: |
          TAG='${{ inputs.tag || github.ref_name }}'
          REVISION=$(git rev-parse HEAD)
          CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          podman manifest create localhost/hotloop-flow-release
          for ARCH in amd64 arm64; do
            podman build \
              --platform "linux/$ARCH" \
              --build-arg "VERSION=$TAG" \
              --label "org.opencontainers.image.version=${TAG#v}" \
              --label "org.opencontainers.image.revision=$REVISION" \
              --label "org.opencontainers.image.created=$CREATED" \
              --manifest localhost/hotloop-flow-release \
              --tag "localhost/hotloop-flow:$ARCH" \
              .
          done
          df -h / | tail -1

      - name: The list holds exactly amd64 and arm64
        run: |
          podman manifest inspect localhost/hotloop-flow-release > list.json
          jq -r '.manifests[] | [.platform.os, .platform.architecture, (.platform.variant // "none"), .digest] | @tsv' list.json
          test "$(jq '.manifests | length' list.json)" = 2
          test "$(jq -r '[.manifests[] | .platform.os + "/" + .platform.architecture] | sort | join(",")' list.json)" = "linux/amd64,linux/arm64"
          test "$(jq '[.manifests[] | [.platform.architecture, (.platform.variant // "")]] | unique | length' list.json)" = 2
          test "$(jq '[.manifests[].digest] | unique | length' list.json)" = 2

      - name: Each platform's binary starts and reports the tag
        run: |
          TAG='${{ inputs.tag || github.ref_name }}'
          for ARCH in amd64 arm64; do
            GOT=$(podman run --rm "localhost/hotloop-flow:$ARCH" version)
            echo "$ARCH: $GOT"
            test "$GOT" = "$TAG" || { echo "::error::$ARCH reports '$GOT', not '$TAG'"; exit 1; }
          done

      - name: Push X.Y.Z, X.Y and X
        # The tags the old metadata action's semver patterns made: the full
        # version always, X.Y and X only for a release and not a prerelease, and
        # no bare X for a 0.x. No branch tag and no bare sha tag: both produce
        # images that are not a released version.
        run: |
          VERSION='${{ inputs.tag || github.ref_name }}'
          VERSION="${VERSION#v}"
          TAGS="$VERSION"
          case "$VERSION" in
            *-*) ;;
            *) MINOR="${VERSION%.*}"; MAJOR="${VERSION%%.*}"
               TAGS="$TAGS $MINOR"
               [ "$MAJOR" = 0 ] || TAGS="$TAGS $MAJOR" ;;
          esac
          for T in $TAGS; do
            podman manifest push --all localhost/hotloop-flow-release "docker://$IMAGE:$T"
          done
          echo "pushed: $TAGS"

      - name: Report image size
        # The whole premise is that this is small. If it stops being small,
        # that is a finding.
        run: |
          SIZE=$(podman image inspect localhost/hotloop-flow:amd64 --format '{{.Size}}')
          echo "### Image size (amd64): $((SIZE/1024/1024)) MiB" >> "$GITHUB_STEP_SUMMARY"
          echo "Measured 2026-08-08: ours 25.1 MB, nodered/node-red:latest 717 MB." >> "$GITHUB_STEP_SUMMARY"
